name: Workday jobs feed

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: workday-jobs-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run offline tests
        run: python -m unittest -v

      - name: Fetch new jobs
        env:
          # Leave JOBS_SOURCE unset (or "public") to read the career sites' public JSON for free.
          # Set the repository variable JOBS_SOURCE=apify and the secret APIFY_TOKEN to use the Actor.
          JOBS_SOURCE: ${{ vars.JOBS_SOURCE || 'public' }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          APIFY_MAX_USD: ${{ vars.APIFY_MAX_USD || '0.50' }}
          KEYWORDS: ${{ vars.KEYWORDS }}
        run: |
          args=()
          IFS=',' read -ra kws <<< "${KEYWORDS}"
          for k in "${kws[@]}"; do
            k="$(echo "$k" | xargs)"
            if [ -n "$k" ]; then args+=(--keyword "$k"); fi
          done
          python workday_feed.py "${args[@]}"

      - name: Commit the CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.csv data/new_jobs.csv
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "New Workday jobs $(date -u +%Y-%m-%d)"
            git push
          fi
